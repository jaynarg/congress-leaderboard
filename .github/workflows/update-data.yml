name: Update Congress data

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC daily = 3 a.m. Pacific (daylight time)
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab
    inputs:
      summary_limit:
        description: "Max bills to summarize this run (blank = normal batch size)"
        required: false
        default: ""
      regenerate_summaries:
        description: "Rewrite summaries that already exist (after a prompt change)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r pipeline/requirements.txt

      - name: Fetch data
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -m pipeline.run

      - name: Summarize bills without a CRS summary
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMMARY_LIMIT: ${{ github.event.inputs.summary_limit }}
          SUMMARY_REGENERATE: ${{ github.event.inputs.regenerate_summaries }}
          PYTHONUNBUFFERED: "1"
        run: python -m pipeline.summarize

      - name: Build stats
        if: always()   # still rebuild the site if summarizing failed
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m pipeline.stats

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data update $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
